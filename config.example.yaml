# visual-understanding provider configuration
#
# Copy this file to one of:
#   1. Path specified by VISUAL_UNDERSTANDING_CONFIG env var
#   2. ~/.config/visual-understanding/config.yaml
#
# API keys can be supplied EITHER way (inline takes precedence):
#   - `api_key_env`: reference an environment variable name
#   - `api_key`:     configure directly in this file (convenient for MCP setups;
#                    keep this file out of version control)
#
# Base URL can also come from an environment variable:
#   - `base_url_env`: env var name holding the endpoint
#   - generic env VISUAL_UNDERSTANDING_BASE_URL + VISUAL_UNDERSTANDING_API_KEY
#     auto-register a provider named `custom` (see README "MCP 配置")
#
# `requires_auth: false` for auth-less OpenAI-compatible endpoints
# (local vLLM/Ollama, internal proxies) — no Authorization header is sent.

default_provider: zhipu

providers:
  # --- Zhipu GLM-V ---
  # Native grounding support (normalized 0-1000 coordinates)
  # Get key: https://bigmodel.cn/usercenter/proj-mgmt/apikeys
  zhipu:
    type: openai_compat
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4
    chat_models:
      - glm-5v
      - glm-5v-turbo
      - glm-4.6v
      - glm-4.6v-flash
      - glm-4.6v-flashx
    default_chat_model: glm-5v-turbo
    supports_video: true
    supports_files: true
    native_grounding: true
    max_images: 50

  # --- OpenAI ---
  # Get key: https://platform.openai.com/api-keys
  openai:
    type: openai_compat
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    chat_models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4.1
      - gpt-4.1-mini
    default_chat_model: gpt-4o
    max_images: 10

  # --- Anthropic Claude ---
  # Get key: https://console.anthropic.com/settings/keys
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    chat_models:
      - claude-sonnet-4-20250514
      - claude-opus-4-20250514
      - claude-3-5-sonnet-20241022
    default_chat_model: claude-sonnet-4-20250514
    max_images: 20

  # --- OpenCode Go (subscription, https://opencode.ai/go) ---
  # Key: your opencode subscription key (auth.json "opencode-go" entry)
  # Env var: OPENCODE_API_KEY
  # NOTE: models use different wire protocols — routed per-model via
  # `model_protocols` (openai → /chat/completions, anthropic → /messages).
  opencode-go:
    type: openai_compat
    api_key_env: OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/go/v1
    chat_models:
      - kimi-k2.7-code
      - hy3
      - mimo-v2.5
      - mimo-v2.5-pro
      - qwen3.7-plus
      - minimax-m3
      - minimax-m2.7
    default_chat_model: kimi-k2.7-code
    model_protocols:
      kimi-k2.7-code: openai
      hy3: openai
      mimo-v2.5: openai
      mimo-v2.5-pro: openai
      qwen3.7-plus: anthropic
      minimax-m3: anthropic
      minimax-m2.7: anthropic
    # Gateway rejects remote image URLs — always re-encode as base64
    images_require_base64: true
    # Hard per-model parameter constraints (always applied)
    model_defaults:
      kimi-k2.7-code:
        temperature: 1        # this model only accepts temperature=1
    max_images: 10
    # Note: coding-focused subscription — no video/file input, no native grounding

  # --- Custom OpenAI-compatible provider (example) ---
  # Uncomment and edit to add your own endpoint (vLLM, Ollama, Azure, Together, etc.)
  #
  # my-local-vlm:
  #   type: openai_compat
  #   api_key_env: LOCAL_API_KEY        # can be any dummy string if your server doesn't need auth
  #   base_url: http://localhost:8080/v1
  #   chat_models:
  #     - qwen-vl-max
  #   default_chat_model: qwen-vl-max
  #   max_images: 10

  # --- Auth-less OpenAI-compatible endpoint (local server, no key needed) ---
  # no-api-vlm:
  #   type: openai_compat
  #   base_url: http://localhost:11434/v1      # e.g. Ollama
  #   requires_auth: false                     # no Authorization header sent
  #   chat_models: [llama3.2-vision]
  #   default_chat_model: llama3.2-vision

  # --- Third-party OpenAI-compatible vision providers (presets, same as built-in defaults) ---

  # 阿里云百炼 DashScope（通义千问 VL 系列）
  # key 获取：https://bailian.console.aliyun.com/
  dashscope:
    type: openai_compat
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    chat_models:
      - qwen-vl-max
      - qwen-vl-plus
      - qwen2.5-vl-72b-instruct
    default_chat_model: qwen-vl-max
    max_images: 10

  # 硅基流动 SiliconFlow（国内直连，开源 VLM 丰富）
  # key 获取：https://cloud.siliconflow.cn/
  siliconflow:
    type: openai_compat
    api_key_env: SILICONFLOW_API_KEY
    base_url: https://api.siliconflow.cn/v1
    chat_models:
      - Qwen/Qwen2.5-VL-72B-Instruct
      - Qwen/Qwen2.5-VL-32B-Instruct
      - Qwen/Qwen2.5-VL-7B-Instruct
    default_chat_model: Qwen/Qwen2.5-VL-72B-Instruct
    max_images: 10

  # OpenRouter（聚合多家模型，需科学上网）
  # key 获取：https://openrouter.ai/keys
  openrouter:
    type: openai_compat
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    chat_models:
      - qwen/qwen2.5-vl-72b-instruct
      - openai/gpt-4o
      - google/gemini-2.0-flash-001
    default_chat_model: qwen/qwen2.5-vl-72b-instruct
    max_images: 10
